<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile02</title>
    <link rel="shortcut icon" href="./Image/mint.png" type="./Image" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  <body>
    <header>
      <nav>
        <a href="#">Home</a>
        <a href="#">Case Studies</a>
        <a href="#">Testimonials</a>
        <a href="#">Recent work</a>
        <a href="#">Get In Touch</a>

      <div class="social">
        <i class="fa-brands fa-linkedin-in"></i>
        <i class="fa-brands fa-behance"></i>
        <i class="fa-brands fa-twitter"></i>
      </div>
    </header>
    <section class="profile">
      <div class="profile-text">
        <h1 style="font-family: Raleway">Woraprat Khruttamkham</h1>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt rem
          odit labore unde nemo omnis sequi hic sit laudantium repellendus
          recusandae vitae ea laborum, ipsa nisi eos autem.

        <a href="#" class="btn">Let’s get started ></a>
      </div>
      <div class="profile-image">
        <img src="./lmage/profile.jpg" alt="Profile Image" />
      </div>
    </section>
    <section class="companies">
      <p>Worked with</p>
      <div class="logos">
        <img src="./lmage/png1.png" alt="ClickUp" />
        <img src="./lmage/png2.png" alt="Dropbox" />
        <img src="./lmage/png3.png" alt="PAYCHEX" />
        <img src="./lmage/png4.png" alt="Elastic" />

    </section>

</html>
